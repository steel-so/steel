# Steel — published sites on *.sites.stratustelecom.com.br (wildcard).
# TLS ends here (own wildcard certificate: *.stratustelecom.com.br does not
# cover two labels). Forwards the original Host to nginx on 10.10.100.145.
<VirtualHost *:80>
    ServerName sites.stratustelecom.com.br
    ServerAlias *.sites.stratustelecom.com.br

    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/steel-sites-80-error.log
    CustomLog ${APACHE_LOG_DIR}/steel-sites-80-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName sites.stratustelecom.com.br
    ServerAlias *.sites.stratustelecom.com.br

    SSLEngine On
    SSLCertificateFile /etc/ssl/steel-sites/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/steel-sites/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    Header always set X-Content-Type-Options "nosniff"

    Timeout 120
    ProxyTimeout 120

    ProxyPass / http://10.10.100.145:80/
    ProxyPassReverse / http://10.10.100.145:80/

    ErrorLog ${APACHE_LOG_DIR}/steel-sites-error.log
    CustomLog ${APACHE_LOG_DIR}/steel-sites-access.log combined
</VirtualHost>

# Source of truth for /etc/nginx/conf.d/steel-realip.conf (http context) on
# the HOMOLOGAÇÃO host (10.10.100.145). ADR 0038.
#
# There TLS ends at the Apache edge on 10.10.100.31, so every connection nginx
# sees comes from it. Restore the visitor from the X-Forwarded-For Apache
# appends, trusting only that address: a request that reaches nginx directly
# keeps its real address, so the header cannot be spoofed around the edge.
# steel-locations.conf then hands the app a single-hop X-Forwarded-For with
# that address, which is what getClientIp() (rate limits, consent records,
# request logs) reads.
#
# Production, with nginx as the edge, does not need this file. Behind
# Cloudflare, install cloudflare-realip.conf instead.
set_real_ip_from 10.10.100.31;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

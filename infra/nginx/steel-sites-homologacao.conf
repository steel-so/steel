# Steel — published sites (<slug>.sites.stratustelecom.com.br). TLS ends on the
# Apache edge (10.10.100.31). Same app locations as the main host; Host is kept
# so proxy.ts can route the subdomain to /s/<slug>.
server {
    listen 80;
    listen [::]:80;

    server_name *.sites.stratustelecom.com.br;
    client_max_body_size 300M;

    location /media/ {
        proxy_pass         http://127.0.0.1:9002/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    set $steel_forwarded_proto https;
    include /etc/nginx/snippets/steel-locations.conf;

    access_log /var/log/nginx/steel-sites.access.log;
    error_log  /var/log/nginx/steel-sites.error.log;
}

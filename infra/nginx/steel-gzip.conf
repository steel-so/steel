# Source of truth for /etc/nginx/conf.d/steel-gzip.conf (http context).
# ADR 0037, same as Nexo's nexo-gzip.conf.
#
# The app runs with `compress: false` (next.config.ts): gzipping every
# response in the Node process costs more CPU than serving a prerendered
# page, and with several replicas CPU is the budget. nginx.conf usually has
# only "gzip on", which covers local files but not proxied responses
# (gzip_proxied off). On homologação the Apache edge (10.10.100.31) also
# compresses; it leaves already-encoded responses alone.
#
# The SSE and MCP locations turn gzip off: compressing a stream holds events
# until a block fills.
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml application/atom+xml application/manifest+json image/svg+xml;

# Source of truth for /etc/nginx/conf.d/steel-upstream.conf (http context) on
# each Steel host. Edit here, then install it there — see
# docs/runbooks/app-replicas.md. ADR 0038.
#
# The app replicas of docker-compose.yml: steel-app (nextjs-app, :3000),
# steel-app-2 (:3001) and steel-app-3 (:3002). least_conn sends each request
# to the replica with the fewest open connections, which evens out cheap API
# calls, heavy page renders and long-lived SSE streams. A replica that fails
# 3 times in 10s leaves the rotation for 10s, so the rolling deploy can
# replace them one at a time without errors reaching users.
upstream steel_app {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    # Idle connections kept open to the replicas (per nginx worker), so a
    # request does not pay a TCP handshake to Node. Needs HTTP/1.1 and an
    # empty Connection header in the locations (steel-locations.conf).
    keepalive 32;
}

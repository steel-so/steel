# Source of truth for the app locations of the Steel server block. Installed
# as /etc/nginx/snippets/steel-locations.conf and included from the domain's
# `server { ... }` — see docs/runbooks/app-replicas.md. ADR 0037.
#
# The server block keeps what is specific to the host (listen, server_name,
# certificates, client_max_body_size, /media/ for MinIO, the ACME challenge)
# and must define, before the include, the scheme the app sees as public:
#
#     set $steel_forwarded_proto https;   # TLS ends before nginx (homologação: Apache .31)
#     # or: set $steel_forwarded_proto $scheme;   # nginx terminates TLS itself
#     include /etc/nginx/snippets/steel-locations.conf;
#
# Needs steel-upstream.conf (upstream steel_app) in conf.d. The app builds its
# public URLs (OAuth metadata, e-mail links) from Host + X-Forwarded-Proto.
#
# X-Forwarded-For is *replaced* by $remote_addr instead of appended to: after
# the real-ip module (steel-realip-*.conf) restored the visitor, that is the
# one address the edge vouches for, and getClientIp() reads the first hop —
# an appended header would let a client choose its own rate-limit bucket.

# Wiki and Canvas co-editing (Hocuspocus, steel-realtime): one process, not
# replicated — its documents live in memory (docs/runbooks/realtime-wiki.md).
location /realtime {
    proxy_pass http://127.0.0.1:1235;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $steel_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# MCP server (ADR 0032): responses may be SSE; never buffer or compress them
# (docs/runbooks/mcp-edge-proxy.md). Stateless, so any replica serves it.
location /api/mcp {
    proxy_pass http://steel_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $steel_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Long-lived SSE streams: WhatsApp inbox, ServiceDesk tickets, notifications
# and the CLI's webhook listener. Any replica can hold one — events fan out
# through Redis pub/sub — and least_conn counts them, so they spread out. The
# app also sends X-Accel-Buffering: no; the explicit rules keep a stream
# flowing even if a route forgets it. A replica restart cuts the stream and
# EventSource reconnects to another one.
location ~ ^/api/(whatsapp/events|workspaces/[^/]+/(servicedesk|notifications)/events|v1/webhooks/listen)$ {
    proxy_pass http://steel_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $steel_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Everything else: pages, Server Actions, the REST API, static assets.
location / {
    proxy_pass http://steel_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $steel_forwarded_proto;
    # A replica being replaced answers with a refused connection or a 502/503;
    # nginx retries idempotent requests on the next replica (never a POST).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    # AI answers stream for a while (they send X-Accel-Buffering: no).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

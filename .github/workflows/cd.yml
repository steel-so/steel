name: CD

# Deploy contínuo para HOMOLOGAÇÃO a cada CI verde em main. Produção é uma
# promoção manual separada (promote-production.yml); rollback em rollback.yml.
#
# Ordem: version -> build (build + Trivy + push) -> migrate -> deploy -> release
#
# ADR — Migrations precisam ser compatíveis com a versão anterior do código
# (expand/contract)
#   Contexto: a migration roda ANTES do deploy, com a versão anterior ainda
#   servindo tráfego; e o rollback (scripts/deploy.sh --rollback) só troca a
#   imagem — Prisma não tem down migrations, o schema continua o novo.
#   Decisão: toda migration tem que funcionar com o código N-1 e com o N.
#     - Expand (neste deploy): só adicionar — tabela/coluna nullable ou com
#       default, índice (CONCURRENTLY quando a tabela for grande), enum value.
#     - Contract (em um deploy POSTERIOR, depois que nenhuma versão rodando
#       depende do antigo): drop de coluna/tabela, NOT NULL sem default,
#       rename (= add + backfill + drop em deploys separados), mudança de tipo.
#   Consequência: se a migration falha o deploy não acontece (deploy needs
#   migrate); se o deploy falha depois da migration, a versão anterior segue
#   funcionando sobre o schema novo, e o rollback é sempre seguro.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Um deploy de homologação por vez; runs novos esperam o anterior terminar
# (e o pendente mais novo substitui um pendente mais antigo).
concurrency:
  group: cd-homologacao
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stratus-so2/steel
  DEPLOY_ENVIRONMENT: homologacao
  DEPLOY_URL: https://homologacao.stratustelecom.com.br
  DEPLOY_DIR: /var/www/steel

jobs:
  version:
    name: Resolve Release Version
    # Porta única do CD: todos os outros jobs dependem deste (`needs: version`),
    # então se ele não roda, nada roda. O `ci.yml` dispara em `push: [main]` e
    # em `pull_request`, e um `workflow_run` não distingue os dois por si — o
    # filtro `branches: [main]` do gatilho olha o `head_branch`, que num PR é a
    # branch do PR, e um PR de fork com a branch chamada "main" passaria por
    # ele. Sem as três condições abaixo, um fork conseguiria rodar o CD (com
    # os segredos de deploy e o runner self-hosted) sobre código não revisado —
    # o padrão "pwn request". Elas são explícitas de propósito: cada uma sozinha
    # já barraria o caso, e nenhuma depende do filtro do gatilho.
    #   event == 'push'                 -> descarta todo run de pull_request
    #   head_repository == repository   -> descarta run originado de fork
    #   head_branch == 'main'           -> descarta push para outra branch
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.calver.outputs.version }}
      short_sha: ${{ steps.calver.outputs.short_sha }}
    steps:
      - name: Checkout repository (tags only)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute CalVer
        id: calver
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # CalVer YYYY.MM.DD[.N] (UTC). First release of the day has no suffix;
          # subsequent deploys the same day get .1, .2, ... (see versioning doc).
          # The same value tags the image, the deploy and the git release.
          TODAY=$(date -u +%Y.%m.%d)
          EXISTING=$(git tag --list "$TODAY" "$TODAY.*" | wc -l)
          if [ "$EXISTING" -eq 0 ]; then VERSION="$TODAY"; else VERSION="$TODAY.$EXISTING"; fi
          echo "Version $VERSION for $SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build, Scan & Push Image
    needs: version
    # Runner hospedado (16GB): o build do Next não cabe mais nos ~3.8GB do
    # runner self-hosted — passou a morrer com `ResourceExhausted` depois que
    # o ServiceDesk e o editor da base de conhecimento entraram. A imagem vai
    # para o GHCR e o deploy continua no runner do servidor (ADR 0009).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      # Build do commit que o CI testou (head_sha), não do HEAD atual de main.
      # Seguro: nenhum job roda sem o `version`, cujo `if` exige workflow_run de
      # evento push, deste repositório e da branch main (ver comentário lá).
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - name: Checkout tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Imutáveis: CalVer (o que é deployado/rollbackado) + sha do commit.
          # Sem :latest — o docker-compose.yml exige STEEL_IMAGE_TAG.
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=sha-${{ needs.version.outputs.short_sha }}

      - name: Build image for scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NODE_BUILD_MEMORY=6144
            NEXT_BUILD_LOW_MEMORY=false
            NEXT_PUBLIC_URL=${{ env.DEPLOY_URL }}
            NEXT_PUBLIC_AXIOM_TOKEN=${{ secrets.NEXT_PUBLIC_AXIOM_TOKEN }}
            NEXT_PUBLIC_AXIOM_DATASET=${{ secrets.NEXT_PUBLIC_AXIOM_DATASET }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_META_APP_ID=${{ secrets.NEXT_PUBLIC_META_APP_ID }}
            NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID=${{ secrets.NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          secrets: |
            hugeicons_token=${{ secrets.HUGEICONS_TOKEN }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          # Block the deploy on CRITICAL only; HIGH stays visible in the log and
          # is chased via Dependabot. Blocking deploys on transitive HIGH (often
          # build-time DoS without a quick fix) is disproportionate.
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "${IMAGE_NAME}:scan" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

  migrate:
    name: Run Database Migrations
    # Só migra depois que a imagem foi construída e passou no scan: uma
    # migration aplicada sem imagem para acompanhar é o pior dos casos.
    needs: [version, build]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      # Mesmo commit da imagem (ver comentário no job build).
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - name: Checkout tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm prisma:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATE }}

  deploy:
    name: Deploy to Homologação
    needs: [version, build, migrate]
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-homologacao
      cancel-in-progress: false
    environment:
      name: homologacao
      url: https://homologacao.stratustelecom.com.br
    steps:
      # Mesmo commit da imagem (docker-compose.yml, scripts/deploy.sh e o .env
      # cifrado precisam casar com a versão deployada).
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - name: Checkout tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt homologação secrets
        run: |
          sops --decrypt secrets/homologacao.enc.env > "${DEPLOY_DIR}/.env"
          # Token de consulta do Axiom (painel /admin/analytics). Fica como
          # secret do GitHub em vez de no arquivo SOPS porque a chave privada
          # do age só existe aqui no CI; vazio = painel mostra "configurar".
          if [ -n "${AXIOM_QUERY_TOKEN}" ]; then
            printf 'AXIOM_QUERY_TOKEN=%s\n' "${AXIOM_QUERY_TOKEN}" >> "${DEPLOY_DIR}/.env"
          fi
          # Runtime alerts (status transitions, dead jobs) for the #alerts
          # Slack channel, read by both the app and the worker. Same reason
          # as above: the secret cannot be read back into sops. sops wins if
          # it ever defines the variable itself.
          if [ -n "${SLACK_ALERTS_WEBHOOK_URL}" ] && ! grep -q '^SLACK_ALERTS_WEBHOOK_URL=' "${DEPLOY_DIR}/.env"; then
            printf 'SLACK_ALERTS_WEBHOOK_URL=%s\n' "${SLACK_ALERTS_WEBHOOK_URL}" >> "${DEPLOY_DIR}/.env"
          fi
          # PABX click-to-call (WhatsApp "Ligar" button): read access to the
          # central steel.device table. Same reason as above; sops wins if it
          # ever defines the variable itself.
          for var in PABX_DEVICE_DB_URL; do
            if [ -n "${!var}" ] && ! grep -q "^${var}=" "${DEPLOY_DIR}/.env"; then
              printf '%s=%s\n' "${var}" "${!var}" >> "${DEPLOY_DIR}/.env"
            fi
          done
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          AXIOM_QUERY_TOKEN: ${{ secrets.AXIOM_QUERY_TOKEN }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          PABX_DEVICE_DB_URL: ${{ secrets.PABX_DEVICE_DB_URL }}

      - name: Deploy versioned image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp docker-compose.yml "${DEPLOY_DIR}/docker-compose.yml"
          scripts/deploy.sh "$VERSION"

  release:
    name: Tag & Release
    needs: [version, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        # Checkout do branch padrão (main), não do head_sha do workflow_run:
        # o job roda com contents:write e o checkout do ref não-confiável do
        # evento é o padrão "pwn request" (Semgrep workflow-run-target-code-checkout).
        # O release é fixado no commit certo via `gh release create --target "$SHA"`.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create CalVer tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ needs.version.outputs.version }}
        run: |
          # Same CalVer as the deployed image (computed once in `version`;
          # the workflow-level concurrency group keeps it unique).
          echo "Releasing $TAG at $SHA"
          # gh creates the tag at $SHA and the release together; --generate-notes
          # builds the body from merged PRs/commits since the previous release.
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes

  notify-slack:
    name: Notify Slack
    needs: [version, build, migrate, deploy]
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Prepare notification context
        id: ctx
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || '' }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          ACTOR: ${{ github.event.workflow_run.head_commit.author.name || github.actor }}
        run: |
          first_line="${COMMIT_MSG%%$'\n'*}"
          escaped=$(printf '%s' "$first_line" | sed 's/\\/\\\\/g; s/"/\\"/g')
          echo "commit_msg=$escaped" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"

          if [[ "${{ needs.migrate.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            echo "status_text=Deploy succeeded" >> "$GITHUB_OUTPUT"
            echo "color=#16a34a" >> "$GITHUB_OUTPUT"
          else
            echo "status_text=Deploy failed" >> "$GITHUB_OUTPUT"
            echo "color=#dc2626" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        # Notificação é best-effort: nunca marca o CD como falho.
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.ctx.outputs.status_text }} on ${{ steps.ctx.outputs.branch }}",
              "attachments": [
                {
                  "color": "${{ steps.ctx.outputs.color }}",
                  "fallback": "${{ steps.ctx.outputs.status_text }} on ${{ steps.ctx.outputs.branch }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": { "type": "mrkdwn", "text": "*${{ steps.ctx.outputs.status_text }}*" }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Environment*\n${{ env.DEPLOY_ENVIRONMENT }}" },
                        { "type": "mrkdwn", "text": "*Version*\n`${{ needs.version.outputs.version }}`" },
                        { "type": "mrkdwn", "text": "*Branch*\n`${{ steps.ctx.outputs.branch }}`" },
                        { "type": "mrkdwn", "text": "*Build*\n${{ needs.build.result }}" },
                        { "type": "mrkdwn", "text": "*Migrate*\n${{ needs.migrate.result }}" },
                        { "type": "mrkdwn", "text": "*Deploy*\n${{ needs.deploy.result }}" },
                        { "type": "mrkdwn", "text": "*Author*\n${{ steps.ctx.outputs.actor }}" },
                        { "type": "mrkdwn", "text": "*Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.ctx.outputs.commit_sha }}|`${{ steps.ctx.outputs.short_sha }}`> ${{ steps.ctx.outputs.commit_msg }}" }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "Open run" },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }

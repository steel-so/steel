name: Inventory agent

# Go agent for the ServiceDesk inventory (S1). Runs only when the agent changes:
# format, vet and tests on Linux, then a cross-build of every release target.
# Binaries are uploaded as artifacts.

on:
  push:
    branches: [main]
    paths:
      - 'inventory-agent/**'
      - '.github/workflows/inventory-agent.yml'
  pull_request:
    paths:
      - 'inventory-agent/**'
      - '.github/workflows/inventory-agent.yml'

permissions:
  contents: read

concurrency:
  group: inventory-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: inventory-agent

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: inventory-agent/go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  build:
    name: Build binaries
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: inventory-agent/go.mod
          cache: false

      - name: Cross-build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
              -o "dist/steel-inventory-agent-${os}-${arch}" .
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: steel-inventory-agent
          path: inventory-agent/dist/*
          retention-days: 30

name: Performance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: avrea-ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        # pgvector for the knowledge search (ADR 0037); a fresh DB per run, so
        # the Debian image is fine here (the servers stay on alpine).
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: steel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/steel_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-not-real
      BETTER_AUTH_URL: http://localhost:3001
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Build application
        run: pnpm build

      - name: Install Lighthouse CI
        run: pnpm add -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun

  k6-local:
    name: k6 Load Tests (Local)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: avrea-ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        # pgvector for the knowledge search (ADR 0037); a fresh DB per run, so
        # the Debian image is fine here (the servers stay on alpine).
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: steel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/steel_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-not-real
      BETTER_AUTH_URL: http://localhost:3001
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Build application
        run: pnpm build

      - name: Start server
        run: pnpm start &
        env:
          PORT: 3001

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3001 > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Run smoke test
        run: k6 run k6/smoke-test.js

      - name: Run API smoke test
        run: k6 run k6/api-smoke-test.js

      - name: Run load test
        continue-on-error: true
        run: k6 run k6/load-test.js

  k6-homolog-smoke:
    name: k6 Homologação Smoke Test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: avrea-ubuntu-latest
    env:
      BASE_URL: https://homologacao.stratustelecom.com.br
      # GitHub runners (US) -> homologação (BR): the body transfer of the
      # landing page alone costs several round trips (~850ms end-to-end with
      # ~40ms of server time). TTFB keeps the 500ms budget; the end-to-end
      # p95 gets a budget that reflects the network path, not the app.
      DURATION_P95_MS: '1500'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Run smoke test against homologação
        run: k6 run k6/smoke-test.js

      - name: Run API smoke test against homologação
        run: k6 run k6/api-smoke-test.js

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Type Check
    # Heavy job: the Avrea runner is killed by the OOM killer on tsc, next build
    # and the image build, so it stays on the GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Type check
        # O projeto passou de 4 GB de heap no `tsc` (padrão do Node no
        # runner) e o job morria com "JavaScript heap out of memory".
        # 6 GB também estourou com os modelos do blog/coleções dos sites
        # (S4); o runner padrão tem 16 GB.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm biome lint --error-on-warnings

      - name: Public API v1 compatibility
        # ADR 0035: `public/openapi.v1.json` only grows. Compares the v1
        # document generated from this commit with the one committed at the
        # PR base (or at the previous push to main) and fails on a removed
        # route or field, a type change or a newly required input.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base revision to compare with."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          pnpm openapi:v1:compat --base "$BASE_SHA"

  unit-tests:
    name: Unit Tests
    # The component tests leave a timer that fires after teardown (input-otp,
    # `window is not defined`); on the slower Avrea runner it surfaces as an
    # unhandled error and fails the job, so it stays on the GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run component tests
        run: pnpm test:component

  integration-tests:
    name: Integration Tests
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 25
    services:
      postgres:
        # pgvector for the knowledge search (ADR 0037); a fresh DB per run, so
        # the Debian image is fine here (the servers stay on alpine).
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: steel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/steel_test
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      # Banco descartável: sem fsync/synchronous_commit o TRUNCATE ... CASCADE
      # entre testes (~150 tabelas) deixa de ser dominado por escrita em disco.
      - name: Tune disposable Postgres for tests
        run: >-
          PGPASSWORD=test psql -h localhost -U test -d steel_test
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Run integration tests
        run: pnpm test:integration

  e2e-tests:
    name: E2E Tests
    # Heavy job: the Avrea runner is killed by the OOM killer on tsc, next build
    # and the image build, so it stays on the GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # pgvector for the knowledge search (ADR 0037); a fresh DB per run, so
        # the Debian image is fine here (the servers stay on alpine).
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: steel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/steel_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-not-real
      BETTER_AUTH_URL: http://localhost:3001
      SKIP_ENV_VALIDATION: 'true'
      # Shared by the server and the test process so the secret-checked routes
      # (status collector, payment webhook) accept the requests the e2e tests send.
      STATUS_COLLECTOR_SECRET: ci-status-collector-secret
      ABACATE_PAY_WEBHOOK_SECRET: ci-abacate-webhook-secret
      # Billing is off by default; the e2e suite runs with it on so the
      # checkout, coupon and webhook tests keep proving today's behavior (the
      # off state is covered by unit tests and the flag-aware e2e cases).
      BILLING_ENABLED: 'true'
      # `next start` runs in production mode, where better-auth's built-in rate
      # limiter is on and would 429 the suite's repeated sign-ups. The app keeps
      # its own auth rate limiting; disable only better-auth's here.
      DISABLE_AUTH_RATE_LIMIT: 'true'
      MAIL_DRY_RUN: 'true'
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_USER: ci-minio-user
      MINIO_PASSWORD: ci-minio-password-not-real
      # Cifra as credenciais de conexão (Postgres externo por módulo, Z-API e
      # Meta do WhatsApp). Sem ela, criar uma conexão responde 500 e os e2e
      # do ServiceDesk/WhatsApp quebram.
      CONNECTION_SECRETS: 1:ci-connection-secret-not-real-0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      # Banco descartável: sem fsync/synchronous_commit o TRUNCATE ... CASCADE
      # entre testes (~150 tabelas) deixa de ser dominado por escrita em disco.
      - name: Tune disposable Postgres for tests
        run: >-
          PGPASSWORD=test psql -h localhost -U test -d steel_test
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      # services: não dá para passar um comando customizado para a imagem do
      # MinIO (precisa de `server /data`), então sobe com `docker run` + loop
      # de espera, como o Redis do job redis-tls-smoke.
      #
      # A imagem é a Silo, fork AGPL mantido do servidor MinIO: a MinIO
      # arquivou o repositório open-source e tirou a distribuição pública do
      # ar — quay.io/minio/minio responde 401 em qualquer tag, o Docker Hub
      # nega acesso e dl.min.io devolve 410 —, o que quebrou este job sem
      # nenhuma mudança nossa. A Silo é drop-in: mesmo comando, mesmas
      # variáveis e o mesmo `/minio/health/live` do loop abaixo (mesma troca
      # já feita no Nexo).
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=$MINIO_USER \
            -e MINIO_ROOT_PASSWORD=$MINIO_PASSWORD \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z \
            server /data

      - name: Wait for MinIO to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO is ready"
              exit 0
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
          done
          echo "MinIO failed to become ready"
          docker logs minio
          exit 1

      - name: Build application
        run: pnpm build

      - name: Start server
        run: pnpm start &
        env:
          PORT: 3001

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3001 > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Run e2e tests
        run: pnpm test:e2e

  coverage-tests:
    name: Coverage Tests
    runs-on: avrea-ubuntu-26.04
    # The suite now runs ~19 min on a hosted runner; 20 cut it off right
    # after a passing run.
    timeout-minutes: 30
    services:
      postgres:
        # pgvector for the knowledge search (ADR 0037); a fresh DB per run, so
        # the Debian image is fine here (the servers stay on alpine).
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: steel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/steel_test
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      # Banco descartável: sem fsync/synchronous_commit o TRUNCATE ... CASCADE
      # entre testes (~150 tabelas) deixa de ser dominado por escrita em disco.
      - name: Tune disposable Postgres for tests
        run: >-
          PGPASSWORD=test psql -h localhost -U test -d steel_test
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Run coverage tests
        run: pnpm test:coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    # Heavy job: the Avrea runner is killed by the OOM killer on tsc, next build
    # and the image build, so it stays on the GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # pgvector for the knowledge search (ADR 0037); a fresh DB per run, so
        # the Debian image is fine here (the servers stay on alpine).
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: steel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/steel_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-not-real
      BETTER_AUTH_URL: http://localhost:3001
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      # Banco descartável: sem fsync/synchronous_commit o TRUNCATE ... CASCADE
      # entre testes (~150 tabelas) deixa de ser dominado por escrita em disco.
      - name: Tune disposable Postgres for tests
        run: >-
          PGPASSWORD=test psql -h localhost -U test -d steel_test
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Build application
        run: pnpm build

  audit:
    name: Dependency Audit
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=critical

  # Monitoring only: uploads SARIF to the Security tab but is intentionally kept
  # out of the gate's needs (and continue-on-error), so a flaky snyk@master run
  # or a high-severity finding doesn't block deploys. Critical dep vulns are
  # still blocked by the audit job.
  snyk:
    name: Snyk Security Scan
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk test
        uses: snyk/actions/node@8e119fbb6c251787721d34ba683ed48eba792766 # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to GitHub
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always() && hashFiles('snyk.sarif') != ''
        continue-on-error: true # Code scanning upload needs GitHub Advanced Security, unavailable on this plan for private repos
        with:
          sarif_file: snyk.sarif

  semgrep:
    name: Semgrep SAST
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Semgrep
        run: semgrep scan --config auto --config p/nextjs --config p/react --config p/typescript --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF to GitHub
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always()
        continue-on-error: true # Code scanning upload needs GitHub Advanced Security, unavailable on this plan for private repos
        with:
          sarif_file: semgrep.sarif

  redis-tls-smoke:
    name: Redis TLS Smoke
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 10
    env:
      REDIS_URL: rediss://:testpassword@localhost:6379
      REDIS_PASSWORD: testpassword
      REDIS_TLS_ENABLED: 'true'
      REDIS_TLS_CA_PATH: ${{ github.workspace }}/redis-tls/ca.crt
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TLS certificates
        run: bash redis-tls/generate.sh

      - name: Start Redis with TLS
        run: |
          docker run -d --name redis-tls \
            -p 6379:6379 \
            -v "$PWD/redis-tls:/opt/bitnami/redis/certs:ro" \
            -e REDIS_PASSWORD=testpassword \
            -e REDIS_TLS_ENABLED=yes \
            -e REDIS_TLS_PORT_NUMBER=6379 \
            -e REDIS_PORT_NUMBER=0 \
            -e REDIS_TLS_CERT_FILE=/opt/bitnami/redis/certs/redis.crt \
            -e REDIS_TLS_KEY_FILE=/opt/bitnami/redis/certs/redis.key \
            -e REDIS_TLS_CA_FILE=/opt/bitnami/redis/certs/ca.crt \
            -e REDIS_TLS_AUTH_CLIENTS=no \
            bitnami/redis:latest

      - name: Wait for Redis TLS to be ready
        run: |
          for i in {1..30}; do
            if docker exec redis-tls redis-cli --tls \
                --cacert /opt/bitnami/redis/certs/ca.crt \
                -a testpassword ping 2>/dev/null | grep -q PONG; then
              echo "Redis TLS is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Redis TLS failed to become ready"
          docker logs redis-tls
          exit 1

      - name: Run Redis TLS smoke test
        run: pnpm vitest --project redis-tls --run

  gitleaks:
    name: Secret Scan
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # The gitleaks CLI instead of gitleaks/gitleaks-action: the action needs a
      # GITLEAKS_LICENSE secret on organization repos, and Dependabot runs get
      # no Actions secrets, so every Dependabot PR failed here. The CLI is free
      # and the tarball is pinned by version and SHA256.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Scans only the commits the PR or push brings in (as the action did);
      # a new branch, or a push whose `before` is gone (force push), scans the
      # whole history.
      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="${PUSH_AFTER}"
          fi
          config_args=()
          if [ -f .gitleaks.toml ]; then
            config_args=(--config .gitleaks.toml)
          fi
          echo "Scanning commits: $range"
          "$RUNNER_TEMP/gitleaks" git . "${config_args[@]}" \
            --log-opts="--no-merges $range" \
            --redact --verbose --no-banner --exit-code 1

  pr-title:
    name: PR Title Convention
    if: github.event_name == 'pull_request'
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title is a conventional commit
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # O CD constrói a imagem num ambiente diferente do job `build`: sem `.env`,
  # sem BETTER_AUTH_URL, com SKIP_ENV_VALIDATION e o Dockerfile inteiro. Um
  # erro que só aparece ali (ex.: código de topo de módulo lendo env em
  # 2026.10.06) passava pelo CI verde e só quebrava o deploy. Este job builda
  # a mesma imagem, sem push e sem upload de source map do Sentry, para que o
  # gate pegue a falha antes do CD.
  docker-build:
    name: Docker Image Build
    # Heavy job: the Avrea runner is killed by the OOM killer on tsc, next build
    # and the image build, so it stays on the GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Só leitura do cache de camadas que o CD publica; o CI nunca escreve nele.
      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          tags: steel-ci:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          build-args: |
            NODE_BUILD_MEMORY=6144
            NEXT_BUILD_LOW_MEMORY=false
          secrets: |
            hugeicons_token=${{ secrets.HUGEICONS_TOKEN }}

  gate:
    name: CI Gate
    needs:
      - lint
      - unit-tests
      - integration-tests
      - e2e-tests
      - coverage-tests
      - build
      - docker-build
      - audit
      - semgrep
      - gitleaks
      - redis-tls-smoke
    if: always()
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required CI jobs did not pass:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: All required checks passed
        run: echo "CI gate green."

  notify-slack:
    name: Notify Slack on Failure
    needs: [gate]
    # Only trunk failures; PRs (Dependabot, external) have no access to the secret.
    if: failure() && github.event_name == 'push'
    runs-on: avrea-ubuntu-26.04
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Prepare notification context
        id: ctx
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
        run: |
          first_line="${COMMIT_MSG%%$'\n'*}"
          escaped=$(printf '%s' "$first_line" | sed 's/\\/\\\\/g; s/"/\\"/g')
          echo "commit_msg=$escaped" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        # Best-effort: never marks the CI run as failed.
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "CI failed: ${{ github.workflow }} on ${{ steps.ctx.outputs.branch }}",
              "attachments": [
                {
                  "color": "#dc2626",
                  "fallback": "CI failed on ${{ steps.ctx.outputs.branch }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": { "type": "mrkdwn", "text": "*CI failed*" }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Workflow*\n${{ github.workflow }}" },
                        { "type": "mrkdwn", "text": "*Branch*\n`${{ steps.ctx.outputs.branch }}`" },
                        { "type": "mrkdwn", "text": "*Author*\n${{ github.actor }}" },
                        { "type": "mrkdwn", "text": "*Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ steps.ctx.outputs.short_sha }}`> ${{ steps.ctx.outputs.commit_msg }}" }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "Open failed run" },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }

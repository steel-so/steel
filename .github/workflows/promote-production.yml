name: Promote to Production

# Promoção manual homologação -> produção de um release CalVer já validado em
# homologação. Inerte até a produção existir: sem vars.PRODUCTION_ENABLED=true
# o workflow só registra um aviso e termina.
#
# A imagem é rebuildada a partir do tag do release porque as NEXT_PUBLIC_*
# (URL, Axiom) são embutidas no bundle em build time — a imagem de
# homologação aponta para homologacao.stratustelecom.com.br. Publicada como
# <versão>-production.
#
# O job deploy usa o environment "production": configure required reviewers
# nele (Settings > Environments) para exigir aprovação antes de migrar/deployar.
#
# Configuração necessária (ver relatório/README de infra):
#   vars (repo):         PRODUCTION_ENABLED=true, PRODUCTION_URL,
#                        PRODUCTION_RUNNER_LABELS (JSON, default ["self-hosted","production"]),
#                        PRODUCTION_DEPLOY_DIR (default /var/www/steel)
#   secrets (env production): PRODUCTION_DATABASE_URL_MIGRATE
#   secrets (repo, opcionais): PRODUCTION_NEXT_PUBLIC_AXIOM_TOKEN, PRODUCTION_NEXT_PUBLIC_AXIOM_DATASET
#   arquivo:             secrets/production.enc.env (SOPS/age, mesmo recipient de .sops.yaml)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release CalVer a promover (ex. 2026.09.18.1). Vazio = release mais recente
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: steel-so/steel

jobs:
  prepare:
    name: Resolve Release
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository (tags only)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and check production readiness
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [[ "$PRODUCTION_ENABLED" != "true" ]]; then
            echo "::notice::Produção não habilitada (vars.PRODUCTION_ENABLED != 'true'); nada a fazer."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$INPUT_VERSION"
          if [[ -z "$VERSION" ]]; then
            VERSION=$(git tag --list '20[0-9][0-9].[0-9][0-9].[0-9][0-9]*' --sort=-v:refname | head -n 1)
          fi
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::Versão inválida: '$VERSION' (esperado CalVer YYYY.MM.DD[.N])"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION não existe"
            exit 1
          fi
          if ! git cat-file -e "refs/tags/$VERSION:secrets/production.enc.env" 2>/dev/null; then
            echo "::error::secrets/production.enc.env não existe no release $VERSION"
            exit 1
          fi
          if [[ -z "$PRODUCTION_URL" ]]; then
            echo "::error::vars.PRODUCTION_URL não definida"
            exit 1
          fi
          echo "Promovendo $VERSION para produção ($PRODUCTION_URL)"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build, Scan & Push Production Image
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          persist-credentials: false

      # Deployment id for the version skew protection (ADR 0038): the commit
      # of the release tag (CalVer has dots, which Next rejects).
      - name: Resolve deployment id
        id: dpl
        run: echo "id=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan-production
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          build-args: |
            NEXT_PUBLIC_URL=${{ vars.PRODUCTION_URL }}
            NEXT_PUBLIC_AXIOM_TOKEN=${{ secrets.PRODUCTION_NEXT_PUBLIC_AXIOM_TOKEN || secrets.NEXT_PUBLIC_AXIOM_TOKEN }}
            NEXT_PUBLIC_AXIOM_DATASET=${{ secrets.PRODUCTION_NEXT_PUBLIC_AXIOM_DATASET || secrets.NEXT_PUBLIC_AXIOM_DATASET }}
            NEXT_DEPLOYMENT_ID=${{ steps.dpl.outputs.id }}
          secrets: |
            hugeicons_token=${{ secrets.HUGEICONS_TOKEN }}
            server_actions_encryption_key=${{ secrets.PRODUCTION_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY || secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan-production
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push scanned image
        env:
          TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-production
        run: |
          docker tag "${IMAGE_NAME}:scan-production" "$TAG"
          docker push "$TAG"

  deploy:
    name: Migrate & Deploy to Production
    needs: [prepare, build]
    runs-on: ${{ fromJSON(vars.PRODUCTION_RUNNER_LABELS || '["self-hosted","production"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    # Required reviewers do environment "production" aprovam aqui, antes de
    # qualquer migration. Migration e deploy no mesmo job = uma aprovação, e o
    # deploy só roda se a migration passar.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR || '/var/www/steel' }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check production secrets
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.PRODUCTION_DATABASE_URL_MIGRATE }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # Nome distinto de propósito: nunca cair no DATABASE_URL_MIGRATE de
          # homologação por fallback de secret de repositório.
          [[ -n "$DATABASE_URL_MIGRATE" ]] || { echo "::error::secret PRODUCTION_DATABASE_URL_MIGRATE ausente"; exit 1; }
          [[ -n "$SOPS_AGE_KEY" ]] || { echo "::error::secret SOPS_AGE_KEY ausente"; exit 1; }

      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm prisma:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_MIGRATE }}

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt production secrets
        run: |
          sops --decrypt secrets/production.enc.env > "${DEPLOY_DIR}/.env"
          # Runtime alerts for the #alerts Slack channel (see cd.yml).
          if [ -n "${SLACK_ALERTS_WEBHOOK_URL}" ] && ! grep -q '^SLACK_ALERTS_WEBHOOK_URL=' "${DEPLOY_DIR}/.env"; then
            printf 'SLACK_ALERTS_WEBHOOK_URL=%s\n' "${SLACK_ALERTS_WEBHOOK_URL}" >> "${DEPLOY_DIR}/.env"
          fi
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}

      - name: Deploy versioned image
        run: |
          cp docker-compose.yml "${DEPLOY_DIR}/docker-compose.yml"
          scripts/deploy.sh "${VERSION}-production"

  notify-slack:
    name: Notify Slack
    needs: [prepare, build, deploy]
    if: always() && needs.prepare.outputs.enabled == 'true'
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Resolve status
        id: ctx
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            echo "status_text=Production promotion succeeded" >> "$GITHUB_OUTPUT"
            echo "color=#16a34a" >> "$GITHUB_OUTPUT"
          else
            echo "status_text=Production promotion failed" >> "$GITHUB_OUTPUT"
            echo "color=#dc2626" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        # Best-effort: never marks the promotion as failed.
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.ctx.outputs.status_text }}: ${{ needs.prepare.outputs.version }}",
              "attachments": [
                {
                  "color": "${{ steps.ctx.outputs.color }}",
                  "fallback": "${{ steps.ctx.outputs.status_text }}: ${{ needs.prepare.outputs.version }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": { "type": "mrkdwn", "text": "*${{ steps.ctx.outputs.status_text }}*" }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Version*\n`${{ needs.prepare.outputs.version }}`" },
                        { "type": "mrkdwn", "text": "*Triggered by*\n${{ github.actor }}" },
                        { "type": "mrkdwn", "text": "*Build*\n${{ needs.build.result }}" },
                        { "type": "mrkdwn", "text": "*Deploy*\n${{ needs.deploy.result }}" }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "Open run" },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }

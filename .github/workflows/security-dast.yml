name: Security DAST

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: avrea-ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: 'https://homologacao.stratustelecom.com.br'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: true
          issue_title: 'OWASP ZAP Baseline Scan Report'
          fail_action: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

  headers-check:
    name: Security Headers Validation
    runs-on: avrea-ubuntu-26.04
    env:
      BASE_URL: https://homologacao.stratustelecom.com.br
    steps:
      # Três classes de resposta, porque cada uma passa por um caminho
      # diferente e já divergiu em produção (ZAP #1/#3/#4/#5/#6):
      #   - página pública: proxy.ts (CSP com nonce) + headers do next.config;
      #   - asset estático: fora do matcher do proxy, só next.config;
      #   - redirect do middleware (`/robots.txt` quando não há rota): a
      #     resposta é montada no proxy e não chega ao route handler.
      # Se qualquer uma perder um header, o CI falha aqui em vez de aparecer
      # no relatório semanal do ZAP.
      - name: Check security headers on page, static asset and redirect
        run: |
          set -uo pipefail

          check_url() {
            local url="$1"
            shift
            echo "--- $url"
            local response
            response=$(curl -sS -D - -o /dev/null --max-time 30 "$url")
            echo "$response"
            local header
            for header in "$@"; do
              if echo "$response" | grep -qi "^$header:"; then
                echo "OK: $header"
              else
                echo "MISSING: $header on $url"
                exit 1
              fi
            done
          }

          # `/` e `/sign-in` são públicas e ganham CSP com nonce no proxy.
          for page in / /sign-in; do
            check_url "${BASE_URL}${page}" \
              x-frame-options x-content-type-options strict-transport-security \
              content-security-policy referrer-policy permissions-policy
          done

          # Asset estático: fora do matcher do proxy (só next.config).
          CHUNK=$(curl -sS --max-time 30 "${BASE_URL}/sign-in" \
            | grep -oE '/_next/static/[^"]+\.js' | head -1)
          if [ -z "$CHUNK" ]; then
            echo "Could not find a _next/static chunk to probe" && exit 1
          fi
          check_url "${BASE_URL}${CHUNK}" \
            x-frame-options x-content-type-options strict-transport-security \
            content-security-policy

          # Redirect do middleware para o login (rota inexistente e privada).
          check_url "${BASE_URL}/robots.txt" \
            x-frame-options x-content-type-options strict-transport-security

          echo "All security headers present."

      # Informativo: o `Server` é do nginx do servidor, que não está neste
      # repositório. Enquanto `server_tokens off;` não for aplicado, o ZAP
      # segue reportando 10036 (ver docs/runbooks/health-check.md).
      - name: Report Server header exposure
        run: |
          SERVER=$(curl -sS -D - -o /dev/null --max-time 30 "${BASE_URL}/" \
            | grep -i '^server:' || true)
          echo "${SERVER:-no Server header}"
          case "$SERVER" in
            *[0-9].[0-9]*)
              echo "::warning title=Server header leaks version::${SERVER} - set 'server_tokens off;' in the nginx config"
              ;;
            *)
              echo "Server header does not expose a version." ;;
          esac

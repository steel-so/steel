name: n8n node

# Verifies and publishes @steel-so/n8n-nodes-steel (integrations/n8n). The
# package has its own lockfile and is not part of the app workspace, so the
# main CI does not install it.
#
# Publishing: push a tag `n8n-node-v<semver>` (for example `n8n-node-v0.1.0`).
# The version is stamped into package.json from the tag and npm publishes with
# trusted publishing over OIDC (provenance), the same path as the Steel CLI.
# Nothing is published from a pull request or from main.

on:
  push:
    branches: [main]
    tags: ['n8n-node-v*']
    paths:
      - integrations/n8n/**
      - .github/workflows/n8n-node.yml
  pull_request:
    paths:
      - integrations/n8n/**
      - .github/workflows/n8n-node.yml

permissions:
  contents: read

concurrency:
  group: n8n-node-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: integrations/n8n

jobs:
  verify:
    name: Verify the n8n node
    runs-on: avrea-ubuntu-latest-4-vcpu
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          package_json_file: integrations/n8n/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: integrations/n8n/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build

      # n8n loads the bundle with require(); prove it loads and that nothing
      # but n8n-workflow is left to resolve at runtime.
      - name: Load the bundle like n8n does
        run: node scripts/check-bundle.cjs

      - run: npm pack --dry-run

  npm:
    name: npm publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: avrea-ubuntu-latest-4-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          package_json_file: integrations/n8n/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: integrations/n8n/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.6.2

      - run: pnpm install --frozen-lockfile

      - name: Stamp the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#n8n-node-v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG is not n8n-node-v<semver>"; exit 1 ;;
          esac
          npm pkg set version="$version"

      - run: pnpm build

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping."
            exit 0
          fi
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --access public --provenance --tag "$tag"

packages:
  - '.'

minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@6.3.1'
  # esbuild 0.28.0 kept only for the react-email preview (see overrides below).
  - 'esbuild@0.28.0'
  # eslint-config-next -> eslint-import-resolver-typescript@3.10.1: backport on
  # the 3.x line published after provenance-attested 4.x releases, so the
  # date-based trust check flags it on every fresh resolution. Frozen installs
  # never re-check it, but Dependabot re-resolves the whole tree for each update
  # and every job died on ERR_PNPM_TRUST_DOWNGRADE until the 55 min timeout.
  - 'eslint-import-resolver-typescript@3.10.1'
  # Árvore do mermaid puxada pelo @excalidraw/excalidraw (bloco de desenho da
  # Wiki): perdeu evidência de trusted publisher em deps transitivas. Mesma
  # exceção aprovada no Nexo; revisitar quando sair versão confiável.
  - 'cytoscape@3.34.1'
  - 'langium@3.3.1'
blockExoticSubdeps: true

overrides:
  # GHSA-p293-qw3h-jr36 / GHSA-2xp9-vwfh-vxw4 (RCE) e GHSA-vcvr-r3jv-pc5j
  # (RCE no next/og, corrigida em 16.3.6): @react-email/ui puxa o próprio
  # next@16.2.x; força toda cópia para a release corrigida.
  next: '>=16.3.6'
  effect: '^3.21.0'
  ioredis: '5.10.1'
  esbuild: '>=0.28.1'
  ws: '>=8.21.0'

  # Vulnerabilidade em dependência transitiva cujo pai ainda não publicou a
  # correção — todas apontadas pelo Snyk/`pnpm audit`. O piso é a release
  # corrigida mais nova que já passou do `minimumReleaseAge` acima; subir o
  # piso é a única forma de corrigir sem esperar o pai.
  #
  # **Todo range é fechado no major.** Um `'>=X'` aberto deixa o pnpm resolver
  # para o major seguinte — na primeira tentativa disto o `undici` foi para a
  # 8, o `js-yaml` para a 5 e o `nanoid` (dependência do postcss, que pede
  # `^3`) para a 5, trocando a vulnerabilidade por uma quebra de API.
  '@hono/node-server': '>=1.19.15 <2.0.0' # GHSA-frvp-7c67-39w9 (path traversal)
  postcss: '>=8.5.23 <9.0.0' # GHSA-r28c-9q8g-f849 + GHSA-fxqj-rqcc-2cmp
  fast-uri: '>=4.1.5 <5.0.0' # 6 advisories: SSRF/host confusion
  hono: '>=4.13.9 <5.0.0' # ReDoS no CORS, XSS no jsx, +5
  browserslist: '>=4.29.1 <5.0.0' # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g
  baseline-browser-mapping: '>=2.11.26 <3.0.0' # GHSA-w5vr-8v7q-w6rv
  mysql2: '>=3.24.4 <4.0.0' # GHSA-3f6p-5ww8-9rcr (vaza senha em texto claro)
  socket.io-parser: '>=4.2.7 <5.0.0' # GHSA-2m8v-j782-fhvr
  engine.io: '>=6.6.11 <7.0.0' # GHSA-2gc4-cqfq-p2gv
  '@xmldom/xmldom': '>=0.8.15 <0.9.0' # 9 advisories: injeção de nome e ReDoS
  ip-address: '>=10.7.2 <11.0.0' # GHSA-mwp4-54f8-5fhr + 6
  qs: '>=6.16.0 <7.0.0' # GHSA-4mjr-xmp4-gh2g + GHSA-x5fp-wj9c-mxmx
  valibot: '>=1.5.0 <2.0.0' # GHSA-5qjj-4xww-7phc
  dompurify: '>=3.4.16 <4.0.0' # GHSA-p98j-92pf-mc4p
  proxy-addr: '>=2.0.8 <3.0.0' # o express@5.2.1 ainda pede 2.0.7
  # GHSA-ggr8-5vv4-36mx: a 7.x nunca foi corrigida, então aqui o major sobe de
  # propósito. O @prisma/config pede `^7`, mas a 8.0.2 já convivia na árvore.
  deepmerge-ts: '>=8.0.2 <9.0.0'
  # GHSA-j95f-988m-3j2f (ReDoS) e GHSA-cp6q-959q-f8rh, corrigidas em 3.30.5.
  # A família `@tiptap/*` subiu junto para 3.31.3 no package.json: o
  # `@tiptap/core` pede `@tiptap/pm` na **versão exata**, então subir só o core
  # deixa o peer insatisfeito e arrisca duas cópias do ProseMirror no bundle.
  # O override cobre qualquer cópia transitiva que ainda peça a versão velha.
  '@tiptap/core': '>=3.31.3 <4.0.0'

  # @platejs/excalidraw 53.0.0 (bloco de desenho da Wiki) fixa o
  # @excalidraw/excalidraw 0.18.0 exato, que puxa mermaid 10 / dompurify 3.1.6
  # (GHSA-39h7-pwv7-rc3x e as XSS do mermaid 10). A 0.18.1 é a release que
  # corrige isso e é a que o package.json lista direto. Remover quando o
  # @platejs/excalidraw depender de >=0.18.1.
  '@platejs/excalidraw>@excalidraw/excalidraw': '0.18.1'

  # katex 0.18 prefixes the CSS classes of the markup it renders, and the
  # stylesheet in app/globals.css comes from the root katex. Every renderer must
  # be on that same line, or its formulas lose their styles: @platejs/math (Wiki
  # and knowledge base equations) pins 0.16.22 and mermaid asks for ^0.16.
  katex: '>=0.18.10 <0.19.0'

  # Overrides por major, porque o repositório carrega duas linhas da mesma
  # biblioteca e juntar as duas num major só quebraria quem pede a antiga.
  'brace-expansion@1': '2.1.7' # 6 advisories de DoS; a 1.x nunca foi corrigida
  'brace-expansion@2': '>=2.1.7 <3.0.0'
  'brace-expansion@4': '>=5.0.12 <6.0.0' # a 4.x também nunca foi corrigida
  'brace-expansion@5': '>=5.0.12 <6.0.0'
  'js-yaml@3': '>=3.15.2 <4.0.0' # 5 advisories de DoS quadrático (via xmlbuilder2)
  'js-yaml@4': '>=4.3.2 <5.0.0'
  'nanoid@3': '>=3.3.19 <4.0.0' # GHSA-28wg-ghj8-5hjv + GHSA-2v37-7h3g-55p8
  # 13 advisories na 7.x, entre elas GHSA-w293-vg96-wgc3 (bypass de validação
  # de certificado TLS). A 6.x (cheerio -> juice, importação de .docx) não tem
  # advisory aberta e fica onde está, para não forçar um major em quem a pede.
  'undici@7': '>=7.29.1 <8.0.0'
  # Deliberate: esbuild 0.28.1+ breaks the react-email dev preview, so pin the
  # preview to 0.28.0. The advisory (GHSA-g7r4-m6w7-qqqr) affects only esbuild's
  # local dev server, never production, and Snyk is non-blocking in CI. Snyk
  # alert #131 is accepted for this reason.
  'react-email>esbuild': '0.28.0'
  # Deliberate: chokidar@4.0.3 (pulled by react-email, a transitive dep of
  # @react-email/editor) was published without npm provenance attestation
  # while 4.0.1/4.0.0 had it, tripping trustPolicy: no-downgrade. Pinned to
  # 4.0.1 (last provenance-attested 4.x release) rather than disabling the
  # policy. chokidar here is only react-email's dev-tooling file watcher, not
  # something @react-email/editor's React component uses at runtime.
  'react-email>chokidar': '4.0.1'

onlyBuiltDependencies:
  - '@prisma/engines'
  - argon2
  - esbuild
  - msw
  - prisma
  - sharp
  - unrs-resolver

# Imagem versionada: STEEL_IMAGE_TAG (CalVer da release, ex. 2026.09.18.1) é
# gravado no .env deste diretório por scripts/deploy.sh — nunca edite à mão
# nem volte para :latest (sem tag não há rollback determinístico).
x-steel-image: &steel-image ghcr.io/steel-so/steel:${STEEL_IMAGE_TAG:?STEEL_IMAGE_TAG não definido; use scripts/deploy.sh <tag>}

# The web app runs as identical replicas behind nginx's `steel_app` upstream
# (least_conn, infra/nginx/steel-upstream.conf) — ADR 0038. One Node process
# saturates a single core, and nothing in a request depends on which replica
# serves it: sessions live in Postgres; rate limits, SSE fan-out (Redis
# pub/sub) and the 'use cache' tag state (lib/next-cache) in Redis. Each
# replica settles around 1 GB of RSS under load; three fit the homologação
# host (10 vCPU / 7.7 GB) next to Postgres, Redis and MinIO.
#
# To add a replica: copy steel-app-3 with the next name and loopback port,
# add the port to the upstream and reload nginx. scripts/deploy.sh rolls every
# service named steel-app or steel-app-<n>, one at a time.
x-steel-app: &steel-app
  image: *steel-image
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - ./redis-tls/ca.crt:/etc/redis-tls/ca.crt:ro
  dns:
    - 8.8.8.8
    - 8.8.4.4
  networks:
    - app-network
  # Next finishes in-flight requests on SIGTERM; open SSE streams are cut and
  # the browsers' EventSource reconnects to another replica.
  stop_grace_period: 30s
  # The rolling deploy waits for this before replacing the next replica, and
  # nginx takes a failing replica out of the upstream (max_fails).
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/status/live"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 30s

services:
  # Replica 1 keeps the service, container name and port of the single app it
  # replaces (`nextjs-app` on 3000), so the worker's status probe, the
  # runbooks and an nginx still pointing at :3000 keep working.
  steel-app:
    <<: *steel-app
    container_name: nextjs-app
    ports:
      - "3000:3000"

  # Loopback only: nginx is the entry point.
  steel-app-2:
    <<: *steel-app
    container_name: steel-app-2
    ports:
      - "127.0.0.1:3001:3000"

  steel-app-3:
    <<: *steel-app
    container_name: steel-app-3
    ports:
      - "127.0.0.1:3002:3000"

  steel-worker:
    image: *steel-image
    container_name: steel-worker
    restart: unless-stopped
    command: ["node", "dist/worker.cjs"]
    env_file:
      - .env
    environment:
      # The status page's "app" probe must reach Next over the Docker network:
      # from inside the container the public domain resolves to the server's
      # own external IP, the router does not hairpin it, and every probe timed
      # out — the page showed a permanent outage. The .env still wins if set.
      STATUS_APP_PROBE_URL: ${STATUS_APP_PROBE_URL:-http://nextjs-app:3000}
    # AudioSocket do atendente de voz (ADR 0046). Fica no loopback até o TI
    # definir VOICE_AGENT_AUDIOSOCKET_BIND com o IP privado que o PABX alcança
    # (e liberar só esse IP no firewall) — docs/runbooks/pabx-voice-agent.md.
    # Sem VOICE_AGENT_AUDIOSOCKET_PORT no .env o worker nem abre a porta.
    ports:
      - "${VOICE_AGENT_AUDIOSOCKET_BIND:-127.0.0.1}:${VOICE_AGENT_AUDIOSOCKET_PORT:-8090}:${VOICE_AGENT_AUDIOSOCKET_PORT:-8090}"
    volumes:
      - ./redis-tls/ca.crt:/etc/redis-tls/ca.crt:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network

  # Colaboração em tempo real da Wiki (Hocuspocus). Só no loopback: a entrada
  # pública é o location /realtime do nginx (mesma origem, para o cookie de
  # sessão chegar aqui) — ver docs/runbooks/realtime-wiki.md.
  steel-realtime:
    image: *steel-image
    container_name: steel-realtime
    restart: unless-stopped
    command: ["node", "dist/realtime.cjs"]
    ports:
      - "127.0.0.1:1235:1235"
    env_file:
      - .env
    environment:
      REALTIME_PORT: "1235"
    volumes:
      - ./redis-tls/ca.crt:/etc/redis-tls/ca.crt:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network

  # PgBouncer in transaction mode in front of steel-db (ADR 0038). Opt-in per
  # environment: it only starts with `COMPOSE_PROFILES=pooler` in the .env,
  # and the app only uses it once DATABASE_URL_POOLED points at
  # steel-pgbouncer:5432. Migrations, backups and restores keep DATABASE_URL
  # (DDL and session state do not survive transaction pooling). No published
  # port: the containers reach it over the Docker network.
  steel-pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: steel-pgbouncer
    restart: unless-stopped
    profiles:
      - pooler
    environment:
      DB_HOST: steel-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: ${POSTGRES_DB:-}
      POOL_MODE: transaction
      # Three replicas x DB_POOL_MAX (20 with the pooler) + worker + realtime.
      MAX_CLIENT_CONN: 300
      # Server connections per user/database pair, shared by every client:
      # 40 + 5 reserve stays well under Postgres' default 100.
      DEFAULT_POOL_SIZE: 40
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      # Lets the same application user read SHOW POOLS (cl_waiting) from the
      # `pgbouncer` console database — see docs/runbooks/app-replicas.md.
      ADMIN_USERS: ${POSTGRES_USER:-}
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: steel_default
